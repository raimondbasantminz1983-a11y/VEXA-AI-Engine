<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VEXA AI Engine</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#111;
      padding:20px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .header{
      background:white;
      padding:25px;
      border-radius:20px;
      margin-bottom:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .header h1{
      font-size:40px;
      margin-bottom:10px;
    }

    .header p{
      color:#666;
      font-size:18px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }

    .card h2{
      margin-bottom:20px;
      font-size:28px;
    }

    .month-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      border:1px solid #ddd;
      border-radius:15px;
      margin-bottom:10px;
    }

    .month-code{
      font-size:28px;
    }

    .stock-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      border:1px solid #ddd;
      border-radius:15px;
      margin-bottom:15px;
    }

    .stock-code{
      font-size:38px;
      font-weight:bold;
    }

    .days{
      font-size:22px;
      font-weight:bold;
      text-align:right;
    }

    .status{
      font-size:14px;
      margin-top:5px;
      color:#666;
    }

    .workflow{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:15px;
      margin-top:15px;
    }

    .workflow-box{
      border:1px solid #ddd;
      border-radius:20px;
      padding:20px;
      text-align:center;
    }

    .workflow-box span{
      font-size:40px;
      display:block;
      margin-bottom:10px;
    }

    .label-box{
      margin-top:20px;
      text-align:center;
    }

    .label{
      display:inline-block;
      background:white;
      border:4px solid black;
      border-radius:25px;
      padding:25px 50px;
      font-size:70px;
      font-weight:bold;
    }

    .small{
      color:#666;
      margin-top:10px;
    }

    @media(max-width:600px){
      .header h1{
        font-size:28px;
      }

      .label{
        font-size:50px;
        padding:20px 30px;
      }

      .stock-code{
        font-size:28px;
      }
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>VEXA AI Engine</h1>
      <p>
        Visual Coding & AI Expiry Intelligence System
      </p>
    </div>

    <div class="grid">

      <div class="card">
        <h2>Month Color Codes</h2>

        <div id="months"></div>
      </div>

      <div class="card">
        <h2>AI Expiry Priority</h2>

        <div id="stocks"></div>
      </div>

    </div>

    <div class="card" style="margin-top:20px;">
      <h2>Workflow</h2>

      <div class="workflow">

        <div class="workflow-box">
          <span>👀</span>
          देखो
        </div>

        <div class="workflow-box">
          <span>🎨</span>
          रंग पहचानो
        </div>

        <div class="workflow-box">
          <span>🤖</span>
          AI कैलकुलेट करेगा
        </div>

        <div class="workflow-box">
          <span>📦</span>
          पहले Expiry हटाओ
        </div>

      </div>
    </div>

    <div class="card label-box">
      <h2>Example Label</h2>

      <div class="label">
        ⚫3🔵
      </div>

      <div class="small">
        जनवरी • Week 3
      </div>
    </div>

  </div>

  <script>

    const months = [
      {month:"जनवरी", code:"⚫🔵"},
      {month:"फरवरी", code:"🟢🔴"},
      {month:"मार्च", code:"🔵🔴"},
      {month:"अप्रैल", code:"🔴🟡"},
      {month:"मई", code:"🔴🔴"},
      {month:"जून", code:"🟡🟡"},
      {month:"जुलाई", code:"🔵🟡"},
      {month:"अगस्त", code:"🔵🔵"},
      {month:"सितंबर", code:"🟢⚫"},
      {month:"अक्टूबर", code:"🟡🟢"},
      {month:"नवंबर", code:"🔵🟢"},
      {month:"दिसंबर", code:"🟢🟢"}
    ];

    const stocks = [
      {
        code:"🔴1🔴",
        month:"मई",
        week:"Week 1",
        days:2,
        status:"URGENT REMOVE"
      },

      {
        code:"⚫3🔵",
        month:"जनवरी",
        week:"Week 3",
        days:5,
        status:"WARNING"
      },

      {
        code:"🟡5🟢",
        month:"अक्टूबर",
        week:"Week 5",
        days:18,
        status:"SAFE"
      }
    ];

    const monthBox = document.getElementById("months");

    months.forEach(item => {

      monthBox.innerHTML += `
        <div class="month-item">
          <div>${item.month}</div>
          <div class="month-code">${item.code}</div>
        </div>
      `;

    });

    const stockBox = document.getElementById("stocks");

    stocks.sort((a,b)=>a.days-b.days);

    stocks.forEach(item => {

      stockBox.innerHTML += `
        <div class="stock-item">

          <div>
            <div class="stock-code">
              ${item.code}
            </div>

            <div class="small">
              ${item.month} • ${item.week}
            </div>
          </div>

          <div class="days">
            ${item.days} Days
            <div class="status">
              ${item.status}
            </div>
          </div>

        </div>
      `;

    });

  </script>

</body>
</html>
